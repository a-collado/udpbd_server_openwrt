- name: Compile the package (No feeds update)
        id: compile
        run: |
          cd ${{ env.WORK_DIR }}

          # Skip feed updates - use what's in the SDK
          echo "Skipping feed updates due to server issues..."

          # Basic configuration
          make defconfig

          # Compile AND package the UDPBD server (compile alone doesn't produce the .ipk)
          make package/udpbd-server/compile V=s
          make package/udpbd-server/install V=s
          make package/index V=s

          # Find the generated IPK file
          IPK_PATH=$(find bin/packages -type f -name "udpbd-server_*.ipk")
          echo "Found IPK: ${IPK_PATH}"
          echo "ipk_path=${IPK_PATH}" >> $GITHUB_OUTPUT
